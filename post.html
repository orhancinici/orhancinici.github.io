    <script>document.documentElement.classList.add('js'); try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>

<body>
    <!-- Üst menü -->

    <footer class="site-footer">

    <script src="assets/js/script.js"></script>
    <script>
        // Marked.js ayarları
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        // Markdown içeriğinden içindekiler tablosu oluştur
        function generateTableOfContents(htmlContent) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;

            const headings = tempDiv.querySelectorAll('h1, h2, h3, h4, h5, h6');

            // Çok az başlık varsa içindekiler tablosu oluşturma
            if (headings.length < 3) {
                return { htmlContent, tocHtml: '' };
            }

            let tocHtml = '<nav class="toc"><div class="toc-title">İçindekiler</div><ul>';

            headings.forEach((heading) => {
                const level = parseInt(heading.tagName.substring(1));

                if (!heading.id) {
                    heading.id = heading.textContent
                        .toLowerCase()
                        .replace(/\s+/g, '-')
                        .replace(/[^\w\-]+/g, '')
                        .replace(/\-\-+/g, '-')
                        .replace(/^-+/, '')
                        .replace(/-+$/, '');
                }

                tocHtml += `<li style="margin-left: ${(level - 1)}rem;"><a href="#${heading.id}">${heading.textContent}</a></li>`;
            });

            tocHtml += '</ul></nav>';

            return { htmlContent: tempDiv.innerHTML, tocHtml };
        }

        // URL'den yazı parametresini al ve içeriği yükle
        async function loadPost() {
            const filename = new URLSearchParams(window.location.search).get('post');
            const contentDiv = document.getElementById('markdownContent');

            if (!filename) {
                window.location.href = 'writings.html';
                return;
            }

            try {
                const postsResponse = await fetch('./yazilar/posts.json');
                if (!postsResponse.ok) throw new Error('Yazı listesi yüklenemedi');
                const posts = await postsResponse.json();

                const post = posts.find(p => p.filename === filename);
                if (!post) throw new Error('Yazı bulunamadı');

                document.title = `${post.title} · Orhan Çinici`;

                const response = await fetch(`./yazilar/${encodeURIComponent(filename)}`);
                if (!response.ok) throw new Error('Yazı içeriği yüklenemedi');

                const markdown = await response.text();
                const { htmlContent, tocHtml } = generateTableOfContents(marked.parse(markdown));
                contentDiv.innerHTML = tocHtml + htmlContent;
            } catch (error) {
                console.error('İçerik yüklenirken hata oluştu:', error);
                contentDiv.innerHTML = '';
                const h1 = document.createElement('h1');
                h1.textContent = 'Yazı açılamadı';
                const p = document.createElement('p');
                p.className = 'error-text';
                p.textContent = error.message;
                contentDiv.append(h1, p);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
