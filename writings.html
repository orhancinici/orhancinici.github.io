    <script src="assets/js/script.js"></script>
    <script>
        // "GG-AA-YYYY" biçimindeki tarihi Date nesnesine çevir
        function parseDate(s) {
            const [d, m, y] = s.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDate(s) {
            return parseDate(s).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        async function loadPosts() {
            const postList = document.getElementById('postList');
            try {
                const response = await fetch('./yazilar/posts.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const posts = await response.json();

                // Yazıları tarihe göre sırala (en yeni en üstte)
                posts.sort((a, b) => parseDate(b.date) - parseDate(a.date));

                postList.innerHTML = '';
                if (!posts.length) {
                    postList.innerHTML = '<li class="post-empty">Henüz yazı yok.</li>';
                    return;
                }

                posts.forEach(post => {
                    const li = document.createElement('li');
                    li.className = 'post-item';
                    const a = document.createElement('a');
                    a.className = 'card';
                    a.href = `post.html?post=${encodeURIComponent(post.filename)}`;
                    const h2 = document.createElement('h2');
                    h2.textContent = post.title;
                    const date = document.createElement('span');
                    date.className = 'post-date';
                    date.textContent = formatDate(post.date);
                    a.append(h2, date);
                    li.appendChild(a);
                    postList.appendChild(li);
                });
            } catch (error) {
                console.error('Yazılar yüklenirken hata oluştu:', error);
                postList.innerHTML = '<li class="post-empty error-text">Yazılar yüklenirken bir hata oluştu.</li>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
